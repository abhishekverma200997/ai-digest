name: Daily AI Digest

on:
  schedule:
    # 13:00 UTC = 9:00 AM EDT (Eastern Daylight Time, summer)
    # In November when Boston flips to EST, change this to "0 14 * * *"
    - cron: "0 13 * * *"
  workflow_dispatch:  # allows manual runs from the Actions tab

permissions:
  contents: write  # so the job can commit updated seen.json back to the repo

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run digest
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python digest.py

      - name: Commit updated seen.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git diff --staged --quiet || git commit -m "Update seen.json [skip ci]"
          git push